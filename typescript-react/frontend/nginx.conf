server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to index.html so the React app
    # handles them client-side (e.g. /benchmark on page refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching for index.html so new deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache Vite-fingerprinted assets aggressively — filenames change on rebuild
    # so there's no risk of serving stale content.
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
